# ── Sprints ───────────────────────────────────────────────────────────────────
# Sprint ID format: S{sprint_number}-{sequence:02d} (e.g., S1-03, S12-01)
sprints:
  - id: 1
    goal: "MVP Foundation — scaffold + file I/O + window persistence + auto-save (no LLM)"
    status: in_progress
    stories:
      - id: S1-01
        title: "Scaffold WinUI 3 (Packaged) project + DI + MVVM wiring"
        status: complete
        tests_executed: true
        test_output: "bmad/artifacts/test-results/S1-01-test-results.md"
        test_result: pass
      - id: S1-02
        title: "FileService + auto-create + auto-save (2s debounce)"
        status: complete
        tests_executed: true
        test_output: "bmad/artifacts/test-results/S1-02-test-results.md"
        test_result: pass
      - id: S1-03
        title: "SettingsService over LocalSettings (paths, window geometry)"
        status: pending
        tests_executed: false
      - id: S1-04
        title: "MainWindow positioning (primary monitor, restore/center fallback)"
        status: pending
        tests_executed: false
      - id: S1-05
        title: "Single-instance mutex + bring-to-front"
        status: pending
        tests_executed: false
      - id: S1-06
        title: "MainView shell: MenuBar + CommandBar + Editor + StatusBar"
        status: pending
        tests_executed: false
      - id: S1-07
        title: "SettingsView shell: NavigationView + Apparence/Fichiers panes"
