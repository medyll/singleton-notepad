        goal: "Chat messages legible and differentiated. Loading state visible. Input ergonomic."
        scope:
          loading_state: >
            IsLoading=true → ProgressRing (indeterminate, small) in message area.
            Normalize button disabled during chat loading (to avoid concurrent LLM calls).
          message_roles: >
            User message: right-aligned, accent background (AccentFillColorDefaultBrush),
            white text, rounded corners 8px top-left/bottom.
            AI message: left-aligned, card background, normal text color.
            System/error message: full-width InfoBar Severity=Error.
          scroll: "Auto-scroll to bottom when new message added (code-behind ScrollViewer.ChangeView)."
          input: >
            TextBox MinHeight=48 (not 72). Send on Ctrl+Enter. Shift+Enter = newline.
            Placeholder: 'Demander à l\'IA...'
          clear_button: >
            Confirmation flyout: 'Effacer tout le chat ?' with Oui/Non buttons.
            Currently: immediate clear, no warning.
          error_display: >
            On LLM error: show InfoBar at top of message list with error details.
            Do not show raw exception message to user.
        acceptance:
          - "User messages right-aligned accent, AI left-aligned card"
          - "ProgressRing visible during LLM call"
          - "Clear requires confirmation"
          - "Ctrl+Enter sends, Shift+Enter newline"
          - "Error shown as InfoBar, not raw exception"

