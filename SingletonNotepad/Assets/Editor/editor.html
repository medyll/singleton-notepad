<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--fg);
    --bg: #ffffff;
    --fg: #1a1a1a;
    --border: #e0e0e0;
    --code-bg: rgba(0,0,0,0.06);
    --blockquote-border: #c0c0c0;
    --blockquote-fg: #666;
    --link: #0066cc;
    --selection-bg: #b3d4ff;
  }
  body.dark {
    --bg: #1e1e1e;
    --fg: #d4d4d4;
    --border: #3a3a3a;
    --code-bg: rgba(255,255,255,0.08);
    --blockquote-border: #555;
    --blockquote-fg: #999;
    --link: #4da3ff;
    --selection-bg: #264f78;
  }

  #editor {
    height: 100vh;
    padding: 20px 24px;
    overflow-y: auto;
    outline: none;
    caret-color: var(--fg);
  }

  /* ProseMirror placeholder */
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: var(--blockquote-fg);
    pointer-events: none;
    float: left;
    height: 0;
  }

  /* Content styles */
  .ProseMirror { outline: none; min-height: 100%; }
  .ProseMirror > * + * { margin-top: 0.5em; }
  .ProseMirror h1 { font-size: 1.8em; font-weight: 700; line-height: 1.3; margin: 0.8em 0 0.3em; }
  .ProseMirror h2 { font-size: 1.4em; font-weight: 600; line-height: 1.3; margin: 0.7em 0 0.25em; }
  .ProseMirror h3 { font-size: 1.2em; font-weight: 600; line-height: 1.3; margin: 0.6em 0 0.2em; }
  .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { font-weight: 600; margin: 0.5em 0 0.2em; }
  .ProseMirror p { line-height: 1.65; margin: 0.2em 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; margin: 0.3em 0; }
  .ProseMirror li { line-height: 1.6; margin: 0.15em 0; }
  .ProseMirror blockquote {
    border-left: 3px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-fg);
    margin: 0.5em 0;
  }
  .ProseMirror code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 0.88em;
  }
  .ProseMirror pre {
    background: var(--code-bg);
    padding: 0.9em 1em;
    border-radius: 5px;
    overflow-x: auto;
    margin: 0.5em 0;
  }
  .ProseMirror pre code { background: none; padding: 0; border-radius: 0; }
  .ProseMirror strong { font-weight: 700; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror a { color: var(--link); }
  .ProseMirror hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* Selection */
  ::selection { background: var(--selection-bg); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="tiptap.bundle.js"></script>
<script>
const { Editor, StarterKit, Placeholder, Markdown } = window.__TipTap;

const editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit.configure({ codeBlock: { HTMLAttributes: {} } }),
    Placeholder.configure({ placeholder: 'Commencer à écrire…' }),
    Markdown.configure({
      html: false,
      tightLists: true,
      transformPastedText: true,
      transformCopiedText: true,
    }),
  ],
  content: '',
  autofocus: false,
  onUpdate({ editor }) {
    const md = editor.storage.markdown.getMarkdown();
    postToHost({ type: 'change', content: md });
  },
});

// C# → JS message handler
window.chrome.webview.addEventListener('message', e => {
  let msg;
  try { msg = JSON.parse(e.data); } catch { return; }

  switch (msg.type) {
    case 'setContent':
      editor.commands.setContent(msg.content ?? '');
      break;
    case 'paste':
      editor.commands.focus();
      editor.commands.insertContent(msg.text ?? '');
      break;
    case 'selectAll':
      editor.commands.focus();
      editor.commands.selectAll();
      break;
    case 'setTheme':
      document.body.classList.toggle('dark', !!msg.dark);
      break;
    case 'focus':
      editor.commands.focus();
      break;
  }
});

function postToHost(obj) {
  window.chrome.webview.postMessage(JSON.stringify(obj));
}

// Signal ready
postToHost({ type: 'ready' });
</script>
</body>
</html>
