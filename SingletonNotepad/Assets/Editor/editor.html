<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--fg);
    --bg: #ffffff;
    --fg: #1a1a1a;
    --border: #e0e0e0;
    --code-bg: rgba(0,0,0,0.06);
    --blockquote-border: #c0c0c0;
    --blockquote-fg: #666;
    --link: #0066cc;
    --selection-bg: #b3d4ff;
  }
  body.dark {
    --bg: #1e1e1e;
    --fg: #d4d4d4;
    --border: #3a3a3a;
    --code-bg: rgba(255,255,255,0.08);
    --blockquote-border: #555;
    --blockquote-fg: #999;
    --link: #4da3ff;
    --selection-bg: #264f78;
  }

  #editor {
    height: 100%;
    padding: 20px 24px;
    overflow-y: auto;
    outline: none;
    caret-color: var(--fg);
  }

  /* ProseMirror placeholder */
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: var(--blockquote-fg);
    pointer-events: none;
    float: left;
    height: 0;
  }

  /* Content styles */
  .ProseMirror { outline: none; min-height: 100%; }
  .ProseMirror > * + * { margin-top: 0.5em; }
  .ProseMirror h1 { font-size: 1.8em; font-weight: 700; line-height: 1.3; margin: 0.8em 0 0.3em; }
  .ProseMirror h2 { font-size: 1.4em; font-weight: 600; line-height: 1.3; margin: 0.7em 0 0.25em; }
  .ProseMirror h3 { font-size: 1.2em; font-weight: 600; line-height: 1.3; margin: 0.6em 0 0.2em; }
  .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { font-weight: 600; margin: 0.5em 0 0.2em; }
  .ProseMirror p { line-height: 1.65; margin: 0.2em 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; margin: 0.3em 0; }
  .ProseMirror li { line-height: 1.6; margin: 0.15em 0; }
  .ProseMirror blockquote {
    border-left: 3px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-fg);
    margin: 0.5em 0;
  }
  .ProseMirror code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 0.88em;
  }
  .ProseMirror pre {
    background: var(--code-bg);
    padding: 0.9em 1em;
    border-radius: 5px;
    overflow-x: auto;
    margin: 0.5em 0;
  }
  .ProseMirror pre code { background: none; padding: 0; border-radius: 0; }
  .ProseMirror strong { font-weight: 700; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror a { color: var(--link); }
  .ProseMirror hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* Selection */
  ::selection { background: var(--selection-bg); }

  /* Diff view styles - inline decorations */
  #editor-container { position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
  
  /* Inline diff decorations */
  .diff-del { background: rgba(209,52,56,0.25); text-decoration: line-through; }
  .diff-ins { background: rgba(16,124,16,0.25); }
  .diff-mod { background: rgba(255,140,0,0.2); }
  
  body.dark .diff-del { background: rgba(209,52,56,0.4); }
  body.dark .diff-ins { background: rgba(16,124,16,0.4); }
  body.dark .diff-mod { background: rgba(255,140,0,0.3); }
  
  /* Action bar - fixed at top of editor */
  #diff-action-bar {
    display: none;
    flex-shrink: 0;
    align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #diff-action-bar.active { display: flex; }
  
  #diff-action-bar .btn {
    padding: 6px 16px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 13px; font-family: inherit;
    background: var(--bg); color: var(--fg);
  }
  #diff-action-bar .btn-apply { background: #107C10; color: #fff; border-color: #107C10; }
  #diff-action-bar .btn-apply:hover { background: #0e6e0e; }
  #diff-action-bar .btn-cancel:hover { background: var(--code-bg); }
  #diff-action-bar .stats { margin-left: auto; font-size: 12px; color: var(--blockquote-fg); }
  #diff-action-bar .stats .added { color: #107C10; }
  #diff-action-bar .stats .deleted { color: #D13438; }
  #diff-action-bar .stats .modified { color: #FF8C00; }
  
  #editor {
    flex: 1;
    overflow-y: auto;
  }
</style>
</head>
<body>
<div id="editor-container">
  <div id="diff-action-bar"></div>
  <div id="editor"></div>
</div>
<script src="tiptap.bundle.js"></script>
<script>
const { Editor, StarterKit, Placeholder, Markdown, Plugin, PluginKey, Decoration, DecorationSet } = window.__TipTap;
let isApplyingHostContent = false;
let lastPostedMarkdown = '';
let diffDecorations = DecorationSet.empty;
let isShowingDiff = false;

const diffPluginKey = new PluginKey('diffPlugin');

const diffPlugin = new Plugin({
  key: diffPluginKey,
  state: {
    init: () => DecorationSet.empty,
    apply(tr, set) {
      const newSet = tr.getMeta(diffPluginKey);
      return newSet !== undefined ? newSet : set.map(tr.mapping, tr.doc);
    }
  },
  props: {
    decorations(state) {
      return this.getState(state);
    }
  }
});

window.__editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit.configure({ codeBlock: { HTMLAttributes: {} } }),
    Placeholder.configure({ placeholder: 'Commencer à écrire…' }),
    Markdown.configure({
      html: false,
      tightLists: true,
      transformPastedText: true,
      transformCopiedText: true,
    }),
  ],
  content: '',
  autofocus: false,
  onBeforeCreate({ editor }) {
    editor.registerPlugin(diffPlugin);
  },
  onUpdate({ editor }) {
    if (isApplyingHostContent) return;
    const md = editor.storage.markdown.getMarkdown();
    if (md === lastPostedMarkdown) return;
    lastPostedMarkdown = md;
    postToHost({ type: 'change', content: md });
  },
});

const editor = window.__editor;

// Called directly via ExecuteScriptAsync from C# (thread-safe path)
window.__setContent = function(content) {
  isApplyingHostContent = true;
  editor.commands.setContent(content, false);
  lastPostedMarkdown = content;
  isApplyingHostContent = false;
};

// C# → JS message handler
window.chrome.webview.addEventListener('message', e => {
  let msg;
  try { msg = JSON.parse(e.data); } catch { return; }

  switch (msg.type) {
    case 'setContent':
      isApplyingHostContent = true;
      editor.commands.setContent(msg.content ?? '', false);
      lastPostedMarkdown = msg.content ?? '';
      isApplyingHostContent = false;
      break;
    case 'paste':
      editor.commands.focus();
      editor.commands.insertContent(msg.text ?? '');
      break;
    case 'selectAll':
      editor.commands.focus();
      editor.commands.selectAll();
      break;
    case 'setTheme':
      document.body.classList.toggle('dark', !!msg.dark);
      break;
    case 'focus':
      editor.commands.focus();
      break;
    case 'setSpellCheck':
      document.getElementById('editor').setAttribute('spellcheck', !!msg.enabled ? 'true' : 'false');
      if (msg.lang) {
        document.getElementById('editor').setAttribute('lang', msg.lang);
        document.body.setAttribute('lang', msg.lang);
      }
      break;
    case 'showDiff':
      renderDiff(msg.hunks, msg.stats);
      break;
    case 'clearDiff':
      clearDiff();
      break;
    case 'applyDiff':
      postToHost({ type: 'applyDiff' });
      break;
    case 'cancelDiff':
      postToHost({ type: 'cancelDiff' });
      break;
  }
});

function postToHost(obj) {
  window.chrome.webview.postMessage(JSON.stringify(obj));
}

function renderDiff(hunks, stats) {
  isShowingDiff = true;
  const editor = window.__editor;
  const { state, view } = editor;
  const { doc } = state;
  
  // Show action bar
  const actionBar = document.getElementById('diff-action-bar');
  actionBar.classList.add('active');
  actionBar.innerHTML = createActionBarHtml(stats);
  
  // Build decorations from hunks
  const decorations = [];
  
  // Get all text content with positions
  const textNodes = [];
  doc.descendants((node, pos) => {
    if (node.isText) {
      textNodes.push({ text: node.text, from: pos, to: pos + node.nodeSize });
    }
  });
  
  // Concatenate all text to search within
  let fullText = '';
  const nodeRanges = [];
  textNodes.forEach(n => {
    nodeRanges.push({ start: fullText.length, end: fullText.length + n.text.length, from: n.from, to: n.to - 1 });
    fullText += n.text;
  });
  
  // Process each hunk
  for (const hunk of (hunks || [])) {
    // Find starting position using context or first change
    let searchStart = 0;
    if (hunk.context_before && hunk.context_before.length > 0) {
      const ctxText = hunk.context_before.join('\n');
      const ctxIdx = fullText.indexOf(ctxText);
      if (ctxIdx !== -1) searchStart = ctxIdx + ctxText.length + 1;
    }
    
    // Process changes
    for (const ch of (hunk.changes || [])) {
      if (ch.kind === 'del') {
        const idx = fullText.indexOf(ch.text, searchStart);
        if (idx !== -1) {
          const range = mapTextToDocPosition(idx, idx + ch.text.length, nodeRanges);
          if (range) decorations.push(Decoration.inline(range.from, range.to, { class: 'diff-del' }));
        }
      } else if (ch.kind === 'ins') {
        // For insertions, find position after the deleted/modified text
        const idx = fullText.indexOf(ch.text, searchStart);
        if (idx !== -1) {
          const range = mapTextToDocPosition(idx, idx + ch.text.length, nodeRanges);
          if (range) decorations.push(Decoration.inline(range.from, range.to, { class: 'diff-ins' }));
        }
      } else if (ch.kind === 'mod') {
        // Modified: mark old text
        if (ch.old) {
          const idx = fullText.indexOf(ch.old, searchStart);
          if (idx !== -1) {
            const range = mapTextToDocPosition(idx, idx + ch.old.length, nodeRanges);
            if (range) decorations.push(Decoration.inline(range.from, range.to, { class: 'diff-mod' }));
          }
        }
        // For new text in mod, we'd need to insert a widget, but for now just mark the old
      }
    }
  }
  
  const decorationSet = decorations.length > 0 ? DecorationSet.create(doc, decorations) : DecorationSet.empty;
  view.dispatch(state.tr.setMeta(diffPluginKey, decorationSet));
  editor.setEditable(false);
}

function mapTextToDocPosition(textFrom, textTo, nodeRanges) {
  // Find which text node(s) contain this range
  let docFrom = -1, docTo = -1;
  
  for (const r of nodeRanges) {
    if (textFrom >= r.start && textFrom < r.end) {
      docFrom = r.from + (textFrom - r.start);
    }
    if (textTo > r.start && textTo <= r.end) {
      docTo = r.to - (r.end - textTo);
      break;
    }
  }
  
  return docFrom !== -1 && docTo !== -1 ? { from: docFrom, to: docTo } : null;
}

function createActionBarHtml(stats) {
  let html = '<button class="btn btn-apply" onclick="postToHost({type:\'applyDiff\'})">✓ Appliquer</button>';
  html += '<button class="btn btn-cancel" onclick="postToHost({type:\'cancelDiff\'})">✗ Annuler</button>';
  html += '<span class="stats">';
  if (stats.added) html += `<span class="added">+${stats.added}</span> `;
  if (stats.deleted) html += `<span class="deleted">-${stats.deleted}</span> `;
  if (stats.modified) html += `<span class="modified">~${stats.modified}</span>`;
  html += '</span>';
  return html;
}

function clearDiff() {
  isShowingDiff = false;
  const editor = window.__editor;
  const { state, view } = editor;
  
  // Hide action bar
  const actionBar = document.getElementById('diff-action-bar');
  actionBar.classList.remove('active');
  actionBar.innerHTML = '';
  
  // Clear decorations
  view.dispatch(state.tr.setMeta(diffPluginKey, DecorationSet.empty));
  editor.setEditable(true);
}

// Signal ready
postToHost({ type: 'ready' });
</script>
</body>
</html>
