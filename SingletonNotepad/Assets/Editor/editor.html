<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--fg);
    --bg: #ffffff;
    --fg: #1a1a1a;
    --border: #e0e0e0;
    --code-bg: rgba(0,0,0,0.06);
    --blockquote-border: #c0c0c0;
    --blockquote-fg: #666;
    --link: #0066cc;
    --selection-bg: #b3d4ff;
  }
  body.dark {
    --bg: #1e1e1e;
    --fg: #d4d4d4;
    --border: #3a3a3a;
    --code-bg: rgba(255,255,255,0.08);
    --blockquote-border: #555;
    --blockquote-fg: #999;
    --link: #4da3ff;
    --selection-bg: #264f78;
  }

  #editor {
    min-height: 100vh;
    padding: 20px 24px;
    overflow-y: auto;
    outline: none;
    caret-color: var(--fg);
  }

  /* ProseMirror placeholder */
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: var(--blockquote-fg);
    pointer-events: none;
    float: left;
    height: 0;
  }

  /* Content styles */
  .ProseMirror { outline: none; min-height: 100%; }
  .ProseMirror > * + * { margin-top: 0.5em; }
  .ProseMirror h1 { font-size: 1.8em; font-weight: 700; line-height: 1.3; margin: 0.8em 0 0.3em; }
  .ProseMirror h2 { font-size: 1.4em; font-weight: 600; line-height: 1.3; margin: 0.7em 0 0.25em; }
  .ProseMirror h3 { font-size: 1.2em; font-weight: 600; line-height: 1.3; margin: 0.6em 0 0.2em; }
  .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { font-weight: 600; margin: 0.5em 0 0.2em; }
  .ProseMirror p { line-height: 1.65; margin: 0.2em 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; margin: 0.3em 0; }
  .ProseMirror li { line-height: 1.6; margin: 0.15em 0; }
  .ProseMirror blockquote {
    border-left: 3px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-fg);
    margin: 0.5em 0;
  }
  .ProseMirror code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 0.88em;
  }
  .ProseMirror pre {
    background: var(--code-bg);
    padding: 0.9em 1em;
    border-radius: 5px;
    overflow-x: auto;
    margin: 0.5em 0;
  }
  .ProseMirror pre code { background: none; padding: 0; border-radius: 0; }
  .ProseMirror strong { font-weight: 700; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror a { color: var(--link); }
  .ProseMirror hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* Selection */
  ::selection { background: var(--selection-bg); }

  /* Diff view styles */
  #diff-view { display: none; font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; line-height: 1.6; }
  #diff-view.active { display: block; }
  #editor.diff-hidden { display: none; }

  .diff-action-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .diff-action-bar .btn {
    padding: 6px 16px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 13px; font-family: inherit;
    background: var(--bg); color: var(--fg);
  }
  .diff-action-bar .btn-apply { background: #107C10; color: #fff; border-color: #107C10; }
  .diff-action-bar .btn-apply:hover { background: #0e6e0e; }
  .diff-action-bar .btn-cancel:hover { background: var(--code-bg); }
  .diff-action-bar .stats { margin-left: auto; font-size: 12px; color: var(--blockquote-fg); }
  .diff-action-bar .stats .added { color: #107C10; }
  .diff-action-bar .stats .deleted { color: #D13438; }
  .diff-action-bar .stats .modified { color: #FF8C00; }

  .diff-hunk { margin: 8px 0; }
  .diff-line {
    padding: 2px 8px; white-space: pre-wrap; word-break: break-word;
    border-left: 3px solid transparent;
  }
  .diff-line.context { color: var(--fg); }
  .diff-line.del {
    background: rgba(209,52,56,0.12); border-left-color: #D13438;
    color: #D13438; text-decoration: line-through;
  }
  .diff-line.ins {
    background: rgba(16,124,16,0.12); border-left-color: #107C10;
    color: #107C10;
  }
  .diff-line.mod-old {
    background: rgba(209,52,56,0.08); border-left-color: #D13438;
  }
  .diff-line.mod-new {
    background: rgba(16,124,16,0.08); border-left-color: #107C10;
  }
  .diff-word-del { background: rgba(209,52,56,0.25); text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
  .diff-word-ins { background: rgba(16,124,16,0.25); border-radius: 2px; padding: 0 2px; }

  body.dark .diff-line.del { background: rgba(209,52,56,0.2); }
  body.dark .diff-line.ins { background: rgba(16,124,16,0.2); }
  body.dark .diff-line.mod-old { background: rgba(209,52,56,0.15); }
  body.dark .diff-line.mod-new { background: rgba(16,124,16,0.15); }
  body.dark .diff-word-del { background: rgba(209,52,56,0.35); }
  body.dark .diff-word-ins { background: rgba(16,124,16,0.35); }
</style>
</head>
<body>
<div id="editor"></div>
<div id="diff-view"></div>
<script src="tiptap.bundle.js"></script>
<script>
const { Editor, StarterKit, Placeholder, Markdown } = window.__TipTap;
let isApplyingHostContent = false;
let lastPostedMarkdown = '';

window.__editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit.configure({ codeBlock: { HTMLAttributes: {} } }),
    Placeholder.configure({ placeholder: 'Commencer à écrire…' }),
    Markdown.configure({
      html: false,
      tightLists: true,
      transformPastedText: true,
      transformCopiedText: true,
    }),
  ],
  content: '',
  autofocus: false,
  onUpdate({ editor }) {
    if (isApplyingHostContent) return;
    const md = editor.storage.markdown.getMarkdown();
    if (md === lastPostedMarkdown) return;
    lastPostedMarkdown = md;
    postToHost({ type: 'change', content: md });
  },
});

const editor = window.__editor;

// Called directly via ExecuteScriptAsync from C# (thread-safe path)
window.__setContent = function(content) {
  isApplyingHostContent = true;
  editor.commands.setContent(content, false);
  lastPostedMarkdown = content;
  isApplyingHostContent = false;
};

// C# → JS message handler
window.chrome.webview.addEventListener('message', e => {
  let msg;
  try { msg = JSON.parse(e.data); } catch { return; }

  switch (msg.type) {
    case 'setContent':
      isApplyingHostContent = true;
      editor.commands.setContent(msg.content ?? '', false);
      lastPostedMarkdown = msg.content ?? '';
      isApplyingHostContent = false;
      break;
    case 'paste':
      editor.commands.focus();
      editor.commands.insertContent(msg.text ?? '');
      break;
    case 'selectAll':
      editor.commands.focus();
      editor.commands.selectAll();
      break;
    case 'setTheme':
      document.body.classList.toggle('dark', !!msg.dark);
      break;
    case 'focus':
      editor.commands.focus();
      break;
    case 'setSpellCheck':
      document.getElementById('editor').setAttribute('spellcheck', !!msg.enabled ? 'true' : 'false');
      if (msg.lang) {
        document.getElementById('editor').setAttribute('lang', msg.lang);
        document.body.setAttribute('lang', msg.lang);
      }
      break;
    case 'showDiff':
      renderDiff(msg.hunks, msg.stats);
      break;
    case 'clearDiff':
      clearDiff();
      break;
  }
});

function postToHost(obj) {
  window.chrome.webview.postMessage(JSON.stringify(obj));
}

function renderDiff(hunks, stats) {
  const view = document.getElementById('diff-view');
  const editorEl = document.getElementById('editor');
  editorEl.classList.add('diff-hidden');
  view.classList.add('active');

  let html = '<div class="diff-action-bar">';
  html += '<button class="btn btn-apply" onclick="postToHost({type:\'applyDiff\'})">✓ Appliquer</button>';
  html += '<button class="btn btn-cancel" onclick="postToHost({type:\'cancelDiff\'})">✗ Annuler</button>';
  html += '<span class="stats">';
  if (stats.added) html += `<span class="added">+${stats.added}</span> `;
  if (stats.deleted) html += `<span class="deleted">-${stats.deleted}</span> `;
  if (stats.modified) html += `<span class="modified">~${stats.modified}</span>`;
  html += '</span></div>';

  for (const hunk of (hunks || [])) {
    html += '<div class="diff-hunk">';
    for (const ctx of (hunk.context_before || [])) {
      html += `<div class="diff-line context">${esc(ctx)}</div>`;
    }
    for (const ch of (hunk.changes || [])) {
      if (ch.kind === 'del') {
        html += `<div class="diff-line del">− ${esc(ch.text)}</div>`;
      } else if (ch.kind === 'ins') {
        html += `<div class="diff-line ins">+ ${esc(ch.text)}</div>`;
      } else if (ch.kind === 'mod') {
        html += `<div class="diff-line mod-old">− ${renderWords(ch.old_words, 'del')}</div>`;
        html += `<div class="diff-line mod-new">+ ${renderWords(ch.new_words, 'ins')}</div>`;
      }
    }
    for (const ctx of (hunk.context_after || [])) {
      html += `<div class="diff-line context">${esc(ctx)}</div>`;
    }
    html += '</div>';
  }

  view.innerHTML = html;
}

function renderWords(words, cls) {
  if (!words || !words.length) return '';
  return words.map(w => w.changed
    ? `<span class="diff-word-${cls}">${esc(w.text)}</span>`
    : esc(w.text)).join('');
}

function clearDiff() {
  const view = document.getElementById('diff-view');
  const editorEl = document.getElementById('editor');
  editorEl.classList.remove('diff-hidden');
  view.classList.remove('active');
  view.innerHTML = '';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Signal ready
postToHost({ type: 'ready' });
</script>
</body>
</html>
